name: Text RAG regression
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-24.04
    services:
      db:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_DB: babycare
          POSTGRES_USER: babycare
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U babycare -d babycare"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      SPRING_PROFILES_ACTIVE: rag
      BABYCARE_DB_URL: jdbc:postgresql://localhost:5432/babycare
      BABYCARE_DB_PASSWORD: test-only
      BABYCARE_BROWSER_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm install --prefix "$RUNNER_TEMP/browser" playwright@1.56.1
      - run: echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Verify original standalone demo database
        run: bash mvnw -B -Dspring.profiles.active=default "-Dtest=GuideAcceptanceTests#policyLifecycleAndBaseline" test
      - name: Verify hybrid permissions, publication rollback and old data backfill
        run: BABYCARE_VECTOR_TEST=1 SPRING_PROFILES_ACTIVE=rag,hybrid bash mvnw -B -Dtest=HybridPolicyTests test
      - run: NODE_PATH="$RUNNER_TEMP/browser/node_modules" bash mvnw -B verify
      - name: Resume a checkpoint in a new JVM and browser
        run: |
          export NODE_PATH="$RUNNER_TEMP/browser/node_modules"
          export BABYCARE_FIXTURES="$RUNNER_TEMP/restart-fixtures"
          cp -r fixtures "$BABYCARE_FIXTURES"
          BABYCARE_RESTART_PHASE=prepare bash mvnw -B "-Dtest=GuideAcceptanceTests#checkpointBrowserAcrossProcesses" test
          python - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ["BABYCARE_FIXTURES"], "catalog-demo.json")
          catalog = json.loads(path.read_text())
          item = next(p for p in catalog["products"] if p["sku"] == "DEMO-003")
          offer = next(o for o in item["store_offers"] if o["store_id"] == "STORE-01")
          offer.update(price_cny=108, available_packs=4)
          path.write_text(json.dumps(catalog, ensure_ascii=False))
          PY
          BABYCARE_RESTART_PHASE=resume bash mvnw -B "-Dtest=GuideAcceptanceTests#checkpointBrowserAcrossProcesses" test
