name: Hybrid RAG comparison
on:
  pull_request:
    paths: ['src/**', 'compose.yaml', 'models/**', '.github/workflows/hybrid-rag.yml', 'fixtures/policies/**', 'pom.xml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BABYCARE_DB_PASSWORD: test-only
      BABYCARE_COMPARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start PostgreSQL and local CPU models
        run: |
          docker compose --profile hybrid up -d --build --wait --wait-timeout 1200
      - run: bash mvnw -B -Dtest=HybridComparisonTests test
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-comparison
          path: target/hybrid-comparison.md
      - if: failure()
        run: docker compose --profile hybrid logs --tail 40
