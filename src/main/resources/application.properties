spring.application.name=babyCare_agent
server.address=127.0.0.1
server.servlet.session.timeout=30m
server.servlet.session.cookie.same-site=strict
server.error.include-message=always
babycare.model-url=${BAILIAN_CHAT_URL:https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
babycare.model-name=${BAILIAN_MODEL:qwen-plus}
babycare.demo-password=${BABYCARE_DEMO_PASSWORD:BabyCare-demo}
# The original standalone demo uses a temporary database; profile rag persists policies.
spring.datasource.url=jdbc:h2:mem:babycare;MODE=PostgreSQL
spring.sql.init.mode=always
babycare.ops-password=${BABYCARE_OPS_PASSWORD:}
babycare.stock-source=${BABYCARE_STOCK_SOURCE:${babycare.fixtures:fixtures}/catalog-demo.json}
babycare.stock-timeout=${BABYCARE_STOCK_TIMEOUT:2s}
babycare.stock-delay-file=${BABYCARE_STOCK_DELAY_FILE:}
babycare.stock-simulated-delay=${BABYCARE_STOCK_SIMULATED_DELAY:10s}
