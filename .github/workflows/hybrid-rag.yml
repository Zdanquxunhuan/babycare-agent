name: Hybrid RAG comparison
on:
  pull_request:
    paths: ['src/**', 'compose.yaml', '.github/workflows/hybrid-rag.yml', 'fixtures/policies/**', 'pom.xml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BABYCARE_DB_PASSWORD: test-only
      BABYCARE_COMPARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start PostgreSQL and local CPU models
        run: |
          docker compose --profile hybrid up -d
          for i in {1..150}; do
            if docker compose --profile hybrid ps --all --status exited --quiet | grep -q .; then exit 1; fi
            if curl -fs --max-time 5 http://localhost:58081/health && curl -fs --max-time 5 http://localhost:58082/health; then exit 0; fi
            sleep 4
          done
          exit 1
      - run: bash mvnw -B -Dtest=HybridComparisonTests test
      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-comparison
          path: target/hybrid-comparison.md
      - if: failure()
        run: docker compose --profile hybrid logs --tail 40
